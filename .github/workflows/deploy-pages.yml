name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      upload_pages: true

  deploy:
    needs: build
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

  verify:
    name: Verify published site and revision
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --only-shell chromium
      - name: Verify the deployed HTTPS URL
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          test -n "$DEPLOYED_URL"
          npx playwright test -c playwright.quality.config.ts published.spec.ts --project=chromium
      - name: Report failed post-deployment verification
        if: failure()
        run: echo "::error::Pages has already deployed. Verification failed for $GITHUB_SHA. Inspect the verify job and published site."
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: published-site-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
