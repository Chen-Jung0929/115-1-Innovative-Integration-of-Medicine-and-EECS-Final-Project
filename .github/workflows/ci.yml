name: Frontend checks
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare Chromium and synthetic video encoder
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run test:smoke
      - name: Save failed browser checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the tested site
        if: inputs.upload_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
